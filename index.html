<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สรุปงานรายเดือน | สำนักงานสถิติจังหวัดหนองบัวลำภู</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1d2433; --muted:#667085; --line:#e4e7ec;
          --brand:#1f6feb; --ok:#12b76a; --warn:#f79009; --bad:#d92d20; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12161f; --card:#1b2130; --text:#e8ebf2; --muted:#98a2b3; --line:#2b3347; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Sarabun',sans-serif; background:var(--bg); color:var(--text); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { margin:0; font-size:20px; }
  header small { color:var(--muted); }
  main { max-width:1000px; margin:0 auto; padding:16px; }
  .bar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  select, button { font:inherit; padding:8px 12px; border:1px solid var(--line); border-radius:8px;
                   background:var(--card); color:var(--text); }
  button.tab.active { background:var(--brand); color:#fff; border-color:var(--brand); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .card .n { font-size:26px; font-weight:700; }
  .card .l { color:var(--muted); font-size:14px; }
  .alert { background:#fef3f2; color:#7a271a; border:1px solid #fda29b; border-radius:10px;
           padding:10px 14px; margin-bottom:14px; }
  @media (prefers-color-scheme: dark) { .alert { background:#3a1a17; color:#fecdca; border-color:#7a271a; } }
  .tablewrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:12px; }
  table { border-collapse:collapse; width:100%; min-width:640px; }
  th, td { padding:10px 12px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:600; font-size:14px; }
  .prog { display:inline-block; width:90px; height:8px; background:var(--line); border-radius:99px;
          vertical-align:middle; margin-right:6px; overflow:hidden; }
  .prog i { display:block; height:100%; background:var(--ok); }
  .bad { color:var(--bad); font-weight:600; }
  #note { color:var(--muted); font-size:13px; margin-top:10px; }
</style>
</head>
<body>
<header>
  <h1>สรุปงานรายเดือน</h1>
  <small>สำนักงานสถิติจังหวัดหนองบัวลำภู · ติดตามงานรายบุคคลและรายโครงการ</small>
</header>
<main>
  <div class="bar">
    <select id="month" aria-label="เลือกเดือน"></select>
    <button class="tab active" data-v="persons">รายบุคคล</button>
    <button class="tab" data-v="projects">รายโครงการ</button>
    <select id="me" aria-label="เลือกชื่อของฉัน"><option value="">แจ้งเตือนของฉัน: เลือกชื่อ</option></select>
  </div>
  <div id="alerts"></div>
  <div class="cards" id="cards"></div>
  <div class="tablewrap"><table id="tbl"></table></div>
  <div id="note"></div>
</main>
<script>
// ใส่ URL ของ Web app (Apps Script) ที่ Deploy แล้ว ถ้าเว้นว่างจะแสดงข้อมูลตัวอย่าง
const API = '';

const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
  'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
let view = 'persons', data = null;
const $ = id => document.getElementById(id);

const DEMO = month => ({ month, label:'ข้อมูลตัวอย่าง',
  total:{planned:20,done:13,remaining:7,pct:65,late:3,overdue:2},
  persons:[{name:'สมชาย ใจดี',planned:8,done:6,remaining:2,pct:75,late:1,overdue:0},
           {name:'สมหญิง รักงาน',planned:12,done:7,remaining:5,pct:58,late:2,overdue:2}],
  projects:[{name:'สำรวจแรงงาน',planned:10,done:7,remaining:3,pct:70,late:1,overdue:1},
            {name:'สำรวจการย้ายถิ่น',planned:6,done:4,remaining:2,pct:67,late:1,overdue:1},
            {name:'สำรวจ ICT ครัวเรือน',planned:4,done:2,remaining:2,pct:50,late:1,overdue:0}] });

function initMonths() {
  const now = new Date(), sel = $('month');
  for (let i = 0; i < 12; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    sel.add(new Option(THAI_MONTHS[d.getMonth()] + ' ' + (d.getFullYear() + 543), key));
  }
}

async function load() {
  const month = $('month').value;
  $('note').textContent = 'กำลังโหลด…';
  try {
    data = API ? await (await fetch(API + '?action=summary&month=' + month)).json() : DEMO(month);
    $('note').textContent = API ? '' : 'ยังไม่ได้ใส่ URL ของ Apps Script จึงแสดงข้อมูลตัวอย่าง';
  } catch (e) { $('note').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + e.message; return; }
  const me = $('me'), keep = me.value;
  me.length = 1;
  data.persons.forEach(p => me.add(new Option(p.name, p.name)));
  me.value = keep;
  render(); loadAlerts();
}

function render() {
  const t = data.total;
  $('cards').innerHTML = [['EA ตามแผน', t.planned], ['ส่งแล้ว', t.done], ['คงเหลือ', t.remaining],
    ['ความคืบหน้า', t.pct + '%'], ['ส่งช้า (ครั้ง)', t.late], ['ค้างส่ง (วัน)', t.overdue]]
    .map(([l, n]) => `<div class="card"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  const rows = data[view].map(o => `<tr><td>${o.name}</td><td>${o.planned}</td><td>${o.done}</td>
    <td>${o.remaining}</td><td><span class="prog"><i style="width:${o.pct}%"></i></span>${o.pct}%</td>
    <td>${o.late}</td><td class="${o.overdue ? 'bad' : ''}">${o.overdue}</td></tr>`).join('');
  $('tbl').innerHTML = `<tr><th>${view === 'persons' ? 'ผู้รับผิดชอบ' : 'โครงการ'}</th><th>EA ตามแผน</th>
    <th>ส่งแล้ว</th><th>คงเหลือ</th><th>ความคืบหน้า</th><th>ส่งช้า</th><th>ค้างส่ง (วัน)</th></tr>` +
    (rows || '<tr><td colspan="7">ยังไม่มีแผนงานของเดือนนี้</td></tr>');
}

async function loadAlerts() {
  const person = $('me').value, box = $('alerts');
  box.innerHTML = '';
  if (!person) return;
  let list = [];
  try {
    list = API ? (await (await fetch(API + '?person=' + encodeURIComponent(person))).json()).alerts
               : (person === 'สมหญิง รักงาน' ? [{date:'8 ตุลาคม 2569', ea:'EA-0123', msg:'ค้างส่งงานประจำวันที่ 8 ตุลาคม 2569'}] : []);
  } catch (e) { return; }
  if (list.length) box.innerHTML = `<div class="alert"><b>คุณมี ${list.length} รายการค้างส่ง</b><br>` +
    list.map(a => `• ${a.msg}`).join('<br>') + '</div>';
}

document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); view = b.dataset.v; if (data) render();
});
$('month').onchange = load; $('me').onchange = loadAlerts;
initMonths(); load();
</script>
</body>
</html>
