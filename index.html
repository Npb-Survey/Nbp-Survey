$('#v4').innerHTML=`<h2 class="sec" style="--a:#0d9488;margin-top:6px"><b>🗓</b>ตารางวันปฏิบัติงานและเวลาปฏิบัติงาน <small>ตุลาคม 2569</small></h2><div class="card"><div style="display:flex;flex-wrap:wrap;gap:12px;align-items:end"><div><label>ผู้ปฏิบัติงาน</label><select onchange="who4=this.value;rsch()">${P.map(n=>`<option ${n==who4?'selected':''}>${n}</option>`).join('')}</select></div><div><label>เวลามาตรฐาน เริ่ม</label><input type="time" id="ss" value="08:30"></div><div><label>เลิก</label><input type="time" id="se" value="16:30"></div><button class="go" onclick="fillStd()">เติมเวลามาตรฐานในวันทำการที่ว่าง</button><b id="sm" style="margin-left:auto"></b></div><p style="color:var(--mu);font-size:13px;margin:10px 0 0">ตัวเอียง = ดึงอัตโนมัติจากข้อมูลลงสนาม (เริ่ม = ครัวเรือนแรกของวัน, เลิก = ครัวเรือนสุดท้ายของวัน) แก้ไขได้ · แก้แล้วบันทึกอัตโนมัติ</p></div><div class="card tw tsh" style="margin-top:12px"><table id="sch"><thead><tr><th>วันที่</th><th>งานที่ทำ (อัตโนมัติ)</th><th>เวลาเริ่ม</th><th>เวลาเลิก</th><th>ชม.</th><th>หมายเหตุ</th></tr></thead><tbody>${tr}</tbody></table></div>`;sumS()}
function sumS(){let t=0,n=0;document.querySelectorAll('#sch tbody tr').forEach(r=>{const h=hrs(r.querySelector('.ts').value,r.querySelector('.te').value);r.querySelector('.th').textContent=h?h.toFixed(1):'';if(h){t+=h;n++}});$('#sm').textContent=`ทำงาน ${n} วัน · รวม ${t.toFixed(1)} ชม.`}
async function savS(rows){rows.forEach(r=>SCH[r.p+'|'+r.d]={s:r.s,e:r.e,n:r.n});try{if(GAS_URL)await fetch(GAS_URL,{method:'POST',body:JSON.stringify({action:'sch',rows})});else localStorage.setItem('nbl_sch',JSON.stringify(SCH))}catch(e){toast('บันทึกไม่สำเร็จ')}}
function sv(el){const r=el.closest('tr'),q=c=>r.querySelector(c);q('.ts').classList.remove('ai');q('.te').classList.remove('ai');savS([{p:who4,d:r.dataset.d,s:q('.ts').value,e:q('.te').value,n:q('.tn').value}]);sumS()}
function fillStd(){const s=$('#ss').value,e=$('#se').value,rows=[];document.querySelectorAll('#sch tbody tr').forEach(r=>{if(!r.classList.contains('wk')&&!r.querySelector('.ts').value&&!r.querySelector('.te').value)rows.push({p:who4,d:r.dataset.d,s,e,n:r.querySelector('.tn').value})});savS(rows).then(()=>{rsch();toast(`เติมเวลา ${rows.length} วัน`)})}
/* ฟอร์ม */
const F=[['SAMSET','SAMSET (ชุดตัวอย่าง)','s',['A','D'],1],['TYPE','ประเภท (TYPE)','s',['1','2']],['ลำดับที่ครัวเรือน','ลำดับที่ครัวเรือน','n',0,1],['MEMBERS','จำนวนสมาชิก','n'],['LISTING','LISTING','n'],['บ้านเลขที่','บ้านเลขที่','t'],['ถนน','ถนน','t'],['ชื่อหัวหน้าครัวเรือน','ชื่อหัวหน้าครัวเรือน','t'],['ผลการแจงนับ','ผลการแจงนับ (รหัส)','s',['11','21','41','42'],1],['ละติจูด','ละติจูด','n'],['ลองติจูด','ลองติจูด','n'],['วันที่ปฏิบัติงานสนาม','วันที่ปฏิบัติงานสนาม','d',0,1],['ไปครั้งที่1','ไปครั้งที่ 1','d'],['ไปครั้งที่2','ไปครั้งที่ 2','d'],['ไปครั้งที่3','ไปครั้งที่ 3','d'],['ไปครั้งสุดท้าย','ไปครั้งสุดท้าย','d'],['วันที่ส่งข้อมูล','วันที่ส่งข้อมูล','d',0,1]];
function form(){const ns=[...new Set(A.map(p=>p.n_))];$('#v2').innerHTML=`<div class="card"><h3>โครงการ สรง. · บันทึกงานที่ทำแล้ว (ตามคอลัมน์ไฟล์ Excel)</h3><br><form id="f"><div><label class="r">ผู้ปฏิบัติงาน</label><select id="who">${ns.map(n=>`<option>${n}</option>`).join('')}</select></div><div><label class="r">PSU_NO</label><select id="psu"></select></div>${F.map(f=>`<div><label class="${f[4]?'r':''}">${f[1]}</label>${f[2]=='s'?`<select name="${f[0]}"><option value="">-- เลือก --</option>${f[3].map(o=>`<option>${o}</option>`).join('')}</select>`:`<input name="${f[0]}" type="${f[2]=='d'?'datetime-local':f[2]=='n'?'number':'text'}" step="any">`}</div>`).join('')}<div style="grid-column:1/-1"><label id="rl">เหตุผลที่ส่งช้า (จำเป็นเมื่อส่งเกินกำหนด)</label><textarea name="เหตุผลส่งช้า" rows="2"></textarea></div><button class="btn">💾 บันทึกข้อมูล</button></form></div><h2>ประวัติที่บันทึกล่าสุด</h2><div class="card tw" id="hist"></div>`;
const up=()=>$('#psu').innerHTML=A.filter(p=>p.n_==$('#who').value).map(p=>`<option value="${p.p}">${p.p} · ${p.t} (EA ${p.ea})</option>`).join('');up();$('#who').onchange=up;hist();
$('#f').onsubmit=async e=>{e.preventDefault();const fm=new FormData(e.target),a=A.find(p=>p.p==$('#psu').value),rec={PSU_NO:a.p,'ชื่อพนักงานแจงนับ':$('#who').value,'รหัสภาค':'ภาคตะวันออกเฉียงเหนือ','รหัสจังหวัด':'หนองบัวลำภู','รหัสอำเภอ':a.a,'รหัสตำบล':a.t,EA:a.ea,'เดือน':10,'ปี':69,'โครงการ':'สรง.69','เหตุผลส่งช้า':fm.get('เหตุผลส่งช้า')};
for(const f of F){let v=fm.get(f[0])||'';if(f[4]&&!v)return toast('กรุณากรอก: '+f[1]);if(f[2]=='d'&&v)v=th(new Date(v));rec[f[0]]=v}
const f0=pd(rec['วันที่ปฏิบัติงานสนาม']),s0=pd(rec['วันที่ส่งข้อมูล']);if(s0<f0)return toast('วันที่ส่งต้องไม่ก่อนวันลงสนาม');
const dl=new Date(f0.getFullYear(),f0.getMonth(),f0.getDate()+GRACE,23,59,59);if(s0>dl){if(!rec['เหตุผลส่งช้า'].trim())return toast(`ส่งช้า ${dur(s0-dl)} กรุณาระบุเหตุผล`);}
if(R.some(r=>+r.PSU_NO===a.p&&r.SAMSET==rec.SAMSET&&+r['ลำดับที่ครัวเรือน']===+rec['ลำดับที่ครัวเรือน']))return toast('มีลำดับครัวเรือนนี้แล้ว (PSU+SAMSET+ลำดับ ซ้ำ แก้ไขย้อนหลังไม่ได้)');
try{if(GAS_URL){const j=await(await fetch(GAS_URL,{method:'POST',body:JSON.stringify(rec)})).json();if(!j.ok)return toast(j.error);await load()}else{added.push(rec);R.push(rec);localStorage.setItem('nbl_added',JSON.stringify(added))}}catch(x){if(GAS_URL)return toast('ส่งข้อมูลไม่สำเร็จ')}
toast('✓ บันทึกแล้ว');e.target.reset();up();hist();render()}}
function hist(){const l=added.slice(-8).reverse();$('#hist').innerHTML=l.length?`<table><tr><th>ผู้ปฏิบัติงาน</th><th>PSU</th><th>ครัวเรือน</th><th>ลงสนาม</th><th>ส่ง</th></tr>${l.map(r=>`<tr><td>${r['ชื่อพนักงานแจงนับ']}</td><td>${r.PSU_NO}</td><td>${r['ลำดับที่ครัวเรือน']}</td><td>${r['วันที่ปฏิบัติงานสนาม']}</td><td>${r['วันที่ส่งข้อมูล']}</td></tr>`).join('')}</table>`:'ยังไม่มีรายการที่บันทึกในเครื่องนี้'}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3200)}
async function load(){if(!GAS_URL)return;try{const j=await(await fetch(GAS_URL+'?t='+Date.now())).json();R=j.data;if(j.assign&&j.assign.length)A=j.assign;if(j.sales&&j.sales.length)SA=j.sales;if(j.sch)j.sch.forEach(r=>SCH[r.p+'|'+r.d]={s:r.s,e:r.e,n:r.n})}catch(e){}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b));['v0','v1','v2','v3','v4'].forEach(v=>$('#'+v).classList.toggle('hide',v!=b.dataset.t))});
(async()=>{await load();form();render();rsch();setInterval(async()=>{await load();render()},GAS_URL?15000:30000)})();
</script></body></html>
