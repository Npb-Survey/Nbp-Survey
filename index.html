const p2=n=>String(n).padStart(2,'0'),fd=d=>d?`${d.getDate()} ${MON[d.getMonth()]} ${(d.getFullYear()+543)%100} ${p2(d.getHours())}:${p2(d.getMinutes())}`:'-';
const th=d=>`${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()+543} ${d.getHours()}:${p2(d.getMinutes())}:00`;
const dur=ms=>{const m=Math.floor(ms/6e4),d=Math.floor(m/1440);return(d?d+' วัน ':'')+Math.floor(m%1440/60)+' ชม. '+m%60+' นาที'};
const LB={ok:'ส่งตรงเวลา',run:'กำลังดำเนินการ',late:'ส่งช้า',over:'ค้างส่งเกินกำหนด',late0:'เลยกำหนด ยังไม่เริ่ม',wait:'ยังไม่ถึงคาบงานสนาม'};
let A=SEED.a,R=SEED.r.map(r=>Object.fromEntries(K.map((k,i)=>[k,r[i]]))),added=[];
try{added=JSON.parse(localStorage.getItem('nbl_added')||'[]');if(!SEED.g)R.push(...added)}catch(e){}
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function calc(){const now=new Date();return A.map(a=>{const rs=R.filter(r=>+r.PSU_NO===a.p),fs=rs.map(r=>pd(r['วันที่ปฏิบัติงานสนาม'])).filter(Boolean),ss=rs.map(r=>pd(r['วันที่ส่งข้อมูล'])).filter(Boolean);
const o={...a,n:rs.length,done:ss.length,late:0,lag:[]};o.rem=Math.max(a.x-o.done,0);
if(!fs.length){o.st=a.d&&new Date(a.d)<=now?'late0':'wait';return o}
const f=new Date(Math.min(...fs)),dl=new Date(f.getFullYear(),f.getMonth(),f.getDate()+GRACE,23,59,59);Object.assign(o,{f,dl});
rs.forEach(r=>{const x=pd(r['วันที่ปฏิบัติงานสนาม']),y=pd(r['วันที่ส่งข้อมูล']);if(x&&y)o.lag.push((y-x)/36e5)});
o.ls=ss.length?new Date(Math.max(...ss)):null;o.lh=ss.filter(s=>s>dl).length;
if(o.done>=a.x){o.late=Math.max(o.ls-dl,0);o.st=o.late>0?'late':'ok'}else if(now>dl){o.late=now-dl;o.st='over'}else o.st='run';return o})}
function render(){const P=calc(),sum=(l,f)=>l.reduce((x,p)=>x+f(p),0),cnt=s=>P.filter(p=>p.st===s).length,fin=cnt('ok')+cnt('late'),bad=cnt('late')+cnt('over')+cnt('late0');
const hh=sum(P,p=>Math.min(p.done,p.x)),ex=sum(P,p=>p.x),names=[...new Set(P.map(p=>p.n_))];
let h=`<div class="g k">${[['PSU ทั้งหมด',P.length,''],['ส่งครบแล้ว',fin,'var(--ok)'],['ครัวเรือนส่งแล้ว',hh+'/'+ex,'var(--pr)'],['ส่งตรงเวลา',fin?Math.round(cnt('ok')/fin*100)+'%':'-','var(--ok)'],['ส่งช้า/ค้างส่ง',bad,'var(--bad)'],['ยังไม่ถึงคาบงานสนาม',cnt('wait'),'var(--gy)']].map(x=>`<div class="card kp"><small>${x[0]}</small><b style="color:${x[2]}">${x[1]}</b></div>`).join('')}</div>`;
h+=`<div class="card"><h3>📁 โครงการสำรวจภาวะการทำงานของประชากร พ.ศ. 2569 (สรง.)</h3><p style="color:var(--mu);margin:2px 0 10px">ความคืบหน้ารายพื้นที่ตัวอย่าง (PSU) · เหลือ ${ex-hh} ครัวเรือน</p><div class="bar">${Object.keys(LB).map(s=>`<i class="${s}" style="background:var(--c);width:${cnt(s)/P.length*100}%"></i>`).join('')}</div><div class="lg">${Object.keys(LB).map(s=>`<span class="${s}"><b>${cnt(s)}</b> ${LB[s]}</span>`).join('')}</div></div>`;
const L=P.filter(p=>['late','over','late0'].includes(p.st)&&p.late).sort((a,b)=>b.late-a.late);
h+=`<h2>🚨 รายชื่อผู้ส่งงานช้า</h2><div class="card tw">${L.length?`<table><tr><th>ผู้ปฏิบัติงาน</th><th>PSU / พื้นที่</th><th>ลงสนาม</th><th>กำหนดส่ง</th><th>ส่งจริง</th><th>ส่งช้า</th></tr>${L.map(p=>`<tr><td>${p.n_}</td><td>${p.p} ${p.t} (${p.a})</td><td>${fd(p.f)}</td><td>${fd(p.dl)}</td><td>${p.st==='over'?'ค้างส่ง '+p.rem+' ครัวเรือน':fd(p.ls)}</td><td class="d">${dur(p.late)}${p.lh?` · ${p.lh} ครัวเรือน`:''}</td></tr>`).join('')}</table>`:'ไม่มีรายการส่งช้า 🎉'}</div>`;
h+=`<h2>👤 ภาพรวมรายบุคคล</h2><div class="g pc">`+names.map(n=>{const q=P.filter(p=>p.n_===n),d=sum(q,p=>Math.min(p.done,p.x)),x=sum(q,p=>p.x),pc=Math.round(d/x*100),f=q.filter(p=>['ok','late'].includes(p.st)).length,ot=q.filter(p=>p.st==='ok').length,lt=q.filter(p=>['late','over','late0'].includes(p.st)),mx=Math.max(0,...lt.map(p=>p.late)),lg=q.flatMap(p=>p.lag),all=q.every(p=>p.st==='wait');
return`<div class="card"><div class="ph"><div class="ring" style="--p:${pc}"><b>${pc}%</b></div><div><h3>${n}</h3><small style="color:var(--mu)">${q[0].r}</small></div></div><div class="s"><div><b>${f}/${q.length}</b><small>PSU ส่งครบ</small></div><div><b>${d}/${x}</b><small>ครัวเรือนส่งแล้ว</small></div><div><b>${x-d}</b><small>งานคงเหลือ</small></div><div><b>${f?Math.round(ot/f*100)+'%':'-'}</b><small>ตรงเวลา</small></div></div>
<div class="al ${all?'z':lt.length?'x':''}">${all?'ยังไม่ถึงคาบงานสนาม':lt.length?`⚠ ส่งช้า ${lt.length} PSU · ช้าสุด ${dur(mx)}`:'✓ ไม่มีงานส่งช้า'}${lg.length?` · ส่งเฉลี่ยหลังลงสนาม ${avg(lg).toFixed(1)} ชม.`:''}</div>`+q.map(p=>`<div class="chip ${p.st}"><div><b>PSU ${p.p}</b> ${p.t} · EA ${p.ea}${p.v?' · '+p.v:''}<br><small style="color:var(--mu)">${p.n?`ส่ง ${p.done}/${p.x} ครัวเรือน`:`ต้องส่ง ${p.x} ครัวเรือน`}</small></div><span>${LB[p.st]}${p.late?'<br>ช้า '+dur(p.late):''}</span></div>`).join('')+`</div>`}).join('')+`</div>`;
const dc={};R.forEach(r=>{const x=pd(r['วันที่ปฏิบัติงานสนาม']);if(x)dc[x.getDate()]=(dc[x.getDate()]||0)+1});const mxd=Math.max(1,...Object.values(dc));
h+=`<h2>📅 จำนวนครัวเรือนที่ลงสนามรายวัน</h2><div class="card"><div class="ch">${Array.from({length:12},(_,i)=>`<div><b>${dc[i+1]||''}</b><i style="height:${(dc[i+1]||0)/mxd*100}px"></i>${i+1}</div>`).join('')}</div></div>`;
$('#v1').innerHTML=h;$('#live').textContent=(GAS_URL?'LIVE · เชื่อม Google Sheet':'DEMO · ข้อมูลจากไฟล์ที่แนบ')+' · อัปเดต '+new Date().toLocaleTimeString('th-TH')}
/* ฟอร์ม */
const F=[['TYPE','ประเภท (TYPE)','s',['1','2']],['ลำดับที่ครัวเรือน','ลำดับที่ครัวเรือน','n',0,1],['MEMBERS','จำนวนสมาชิก','n'],['LISTING','LISTING','n'],['บ้านเลขที่','บ้านเลขที่','t'],['ถนน','ถนน','t'],['ชื่อหัวหน้าครัวเรือน','ชื่อหัวหน้าครัวเรือน','t'],['ผลการแจงนับ','ผลการแจงนับ (รหัส)','s',['11','21','41','42'],1],['ละติจูด','ละติจูด','n'],['ลองติจูด','ลองติจูด','n'],['วันที่ปฏิบัติงานสนาม','วันที่ปฏิบัติงานสนาม','d',0,1],['ไปครั้งที่1','ไปครั้งที่ 1','d'],['ไปครั้งที่2','ไปครั้งที่ 2','d'],['ไปครั้งที่3','ไปครั้งที่ 3','d'],['ไปครั้งสุดท้าย','ไปครั้งสุดท้าย','d'],['วันที่ส่งข้อมูล','วันที่ส่งข้อมูล','d',0,1]];
function form(){const ns=[...new Set(A.map(p=>p.n_))];$('#v2').innerHTML=`<div class="card"><h3>บันทึกงานที่ทำแล้ว (ตามคอลัมน์ไฟล์ Excel)</h3><br><form id="f"><div><label class="r">ผู้ปฏิบัติงาน</label><select id="who">${ns.map(n=>`<option>${n}</option>`).join('')}</select></div><div><label class="r">PSU_NO</label><select id="psu"></select></div>${F.map(f=>`<div><label class="${f[4]?'r':''}">${f[1]}</label>${f[2]=='s'?`<select name="${f[0]}"><option value="">-- เลือก --</option>${f[3].map(o=>`<option>${o}</option>`).join('')}</select>`:`<input name="${f[0]}" type="${f[2]=='d'?'datetime-local':f[2]=='n'?'number':'text'}" step="any">`}</div>`).join('')}<div style="grid-column:1/-1"><label id="rl">เหตุผลที่ส่งช้า (จำเป็นเมื่อส่งเกินกำหนด)</label><textarea name="เหตุผลส่งช้า" rows="2"></textarea></div><button class="btn">💾 บันทึกข้อมูล</button></form></div><h2>ประวัติที่บันทึกล่าสุด</h2><div class="card tw" id="hist"></div>`;
const up=()=>$('#psu').innerHTML=A.filter(p=>p.n_==$('#who').value).map(p=>`<option value="${p.p}">${p.p} · ${p.t} (EA ${p.ea})</option>`).join('');up();$('#who').onchange=up;hist();
$('#f').onsubmit=async e=>{e.preventDefault();const fm=new FormData(e.target),a=A.find(p=>p.p==$('#psu').value),rec={PSU_NO:a.p,'ชื่อพนักงานแจงนับ':$('#who').value,'รหัสภาค':'ภาคตะวันออกเฉียงเหนือ','รหัสจังหวัด':'หนองบัวลำภู','รหัสอำเภอ':a.a,'รหัสตำบล':a.t,EA:a.ea,'เดือน':10,'ปี':69,'โครงการ':'สรง.69','เหตุผลส่งช้า':fm.get('เหตุผลส่งช้า')};
for(const f of F){let v=fm.get(f[0])||'';if(f[4]&&!v)return toast('กรุณากรอก: '+f[1]);if(f[2]=='d'&&v)v=th(new Date(v));rec[f[0]]=v}
const f0=pd(rec['วันที่ปฏิบัติงานสนาม']),s0=pd(rec['วันที่ส่งข้อมูล']);if(s0<f0)return toast('วันที่ส่งต้องไม่ก่อนวันลงสนาม');
const dl=new Date(f0.getFullYear(),f0.getMonth(),f0.getDate()+GRACE,23,59,59);if(s0>dl){if(!rec['เหตุผลส่งช้า'].trim())return toast(`ส่งช้า ${dur(s0-dl)} กรุณาระบุเหตุผล`);}
if(R.some(r=>+r.PSU_NO===a.p&&+r['ลำดับที่ครัวเรือน']===+rec['ลำดับที่ครัวเรือน']))return toast('มีลำดับครัวเรือนนี้แล้ว (แก้ไขย้อนหลังไม่ได้)');
try{if(GAS_URL){const j=await(await fetch(GAS_URL,{method:'POST',body:JSON.stringify(rec)})).json();if(!j.ok)return toast(j.error);await load()}else{added.push(rec);R.push(rec);localStorage.setItem('nbl_added',JSON.stringify(added))}}catch(x){if(GAS_URL)return toast('ส่งข้อมูลไม่สำเร็จ')}
toast('✓ บันทึกแล้ว');e.target.reset();up();hist();render()}}
function hist(){const l=added.slice(-8).reverse();$('#hist').innerHTML=l.length?`<table><tr><th>ผู้ปฏิบัติงาน</th><th>PSU</th><th>ครัวเรือน</th><th>ลงสนาม</th><th>ส่ง</th></tr>${l.map(r=>`<tr><td>${r['ชื่อพนักงานแจงนับ']}</td><td>${r.PSU_NO}</td><td>${r['ลำดับที่ครัวเรือน']}</td><td>${r['วันที่ปฏิบัติงานสนาม']}</td><td>${r['วันที่ส่งข้อมูล']}</td></tr>`).join('')}</table>`:'ยังไม่มีรายการที่บันทึกในเครื่องนี้'}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3200)}
async function load(){if(!GAS_URL)return;try{const j=await(await fetch(GAS_URL+'?t='+Date.now())).json();R=j.data;if(j.assign&&j.assign.length)A=j.assign}catch(e){}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x==b));['v1','v2'].forEach(v=>$('#'+v).classList.toggle('hide',v!=b.dataset.t))});
(async()=>{await load();form();render();setInterval(async()=>{await load();render()},GAS_URL?15000:30000)})();
</script></body></html>
