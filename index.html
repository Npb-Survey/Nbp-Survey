const SHEET_ID = 'ใส่ GOOGLE SHEET ID ที่นี่';
const SHEET_NAME = 'ผลดำเนินงาน ตค69';

function doPost(e){
  try{
    const ss = SpreadsheetApp.openById(SHEET_ID);
    const sheet = ss.getSheetByName(SHEET_NAME) || ss.insertSheet(SHEET_NAME);
    const data = JSON.parse(e.postData.contents);
    
    // หัวตารางอัตโนมัติ
    if(sheet.getLastRow()===0){
      sheet.appendRow(["timestamp","ชื่อ","PSU","อำเภอ","ตำบล","EA","หมู่","บ้าน","วันที่ปฏิบัติ","วันที่ส่ง","ช้า(วัน)","ปริมาณทั้งสิ้น","รวมได้","ได้ข้อมูล11","ได้12","ไม่ได้41","42","43","21","22","31","49","ร้อยละ","หมายเหตุ"]);
    }
    
    const delay = calcDelay(data.opDate, data.sendDate);
    const percent = data.total>0 ? Math.round(data.gotInfo/data.total*100) : 0;
    
    sheet.appendRow([
      new Date(), data.name, data.psu, data.district, data.tambon, data.ea, data.moo, data.village,
      data.opDate, data.sendDate, delay,
      data.total, data.got, data.got11, data.got12,
      data.not41, data.not42, data.not43, data.not21, data.not22, data.not31, data.not49,
      percent, data.note
    ]);
    
    return ContentService.createTextOutput(JSON.stringify({success:true, delay, percent}))
      .setMimeType(ContentService.MimeType.JSON);
  }catch(err){
    return ContentService.createTextOutput(JSON.stringify({success:false, error: err.message}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function calcDelay(op, send){
  const d1 = new Date(op); const d2 = new Date(send);
  return Math.max(0, Math.floor((d2-d1)/(1000*60*60*24)));
}

function doGet(){
  return HtmlService.createHtmlOutputFromFile('Dashboard')
    .setTitle('Dashboard ตค69 - หนองบัวลำภู')
    .addMetaTag('viewport','width=device-width, initial-scale=1');
}

const SHEET_ID = 'ใส่ GOOGLE SHEET ID ที่นี่';

function doPost(e){
  try{
    const ss = SpreadsheetApp.openById(SHEET_ID);
    const sheet = ss.getSheetByName(SHEET_NAME) || ss.insertSheet(SHEET_NAME);
    const data = JSON.parse(e.postData.contents);

    }
    
    const delay = calcDelay(data.opDate, data.sendDate);
    const percent = data.total>0 ? Math.round(data.gotInfo/data.total*100) : 0;
    
    sheet.appendRow([
      new Date(), data.name, data.psu, data.district, data.tambon, data.ea, data.moo, data.village,
      data.opDate, data.sendDate, delay,
      data.total, data.got, data.got11, data.got12,
      data.not41, data.not42, data.not43, data.not21, data.not22, data.not31, data.not49,
      percent, data.note
    ]);
    
    return ContentService.createTextOutput(JSON.stringify({success:true, delay, percent}))
      .setMimeType(ContentService.MimeType.JSON);
  }catch(err){
    return ContentService.createTextOutput(JSON.stringify({success:false, error: err.message}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function calcDelay(op, send){
  const d1 = new Date(op); const d2 = new Date(send);
  return Math.max(0, Math.floor((d2-d1)/(1000*60*60*24)));
}
